[package]
name = "flare-selene"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "flare_selene"
crate-type = ["rlib"]

[features]
default = []
# Fixtures that tests of other crates share with this crate's own tests.
test-support = []

[dependencies]
blake2 = "0.10"
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_LibraryLoader", "Win32_System_Com", "Win32_UI_Shell", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
