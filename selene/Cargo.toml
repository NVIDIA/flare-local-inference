[package]
name = "flare-selene"
version = "0.1.0"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "flare_selene"
crate-type = ["rlib"]

[features]
default = []
# Fixtures that tests of other crates share with this crate's own tests.
test-support = []

[dependencies]
flare-eos = { path = "../eos" }
blake2 = "0.10"
libc = "0.2.189"
twox-hash = { version = "2.1", default-features = false, features = ["xxhash3_64"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"
