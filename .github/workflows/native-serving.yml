name: Native serving

on:
  push:
    branches: [main, feature/windows-serving]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build nasm protobuf-compiler libssl-dev liburing-dev
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc nasm --yes --no-progress
          'C:\Program Files\NASM' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Build native serving
        id: build
        run: cargo build --locked --release --manifest-path flare/Cargo.toml
      - name: Test host OS helpers
        run: cargo test --locked --release --manifest-path eos/Cargo.toml --target-dir flare/target
      - name: Test host cache tiers
        run: cargo test --locked --release --manifest-path selene/selene/Cargo.toml --target-dir flare/target
      - name: Test native runtime on Linux
        if: runner.os == 'Linux'
        run: |
          ulimit -l
          sudo prlimit --pid $$ --memlock=67108864:67108864
          cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare/target --features runtime-package,server
      - name: Test native runtime on Windows
        if: runner.os == 'Windows'
        run: cargo test --locked --release --manifest-path helios/Cargo.toml --target-dir flare/target --features runtime-package,server
      - name: Test native CLI
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --locked --release --manifest-path flare/Cargo.toml
      - name: Exercise native Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = '.\flare\target\release\flare.exe'
          & $exe --help
          if ($LASTEXITCODE -ne 0) { throw "$exe --help failed" }
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "$exe --version failed" }
          & $exe agent
          if ($LASTEXITCODE -eq 0) { throw "$exe accepted unsupported multi-host serving" }
          exit 0
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: flare-windows-native
          path: flare/target/release/flare.exe
